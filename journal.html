<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trade Journal 2026</title>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:#050816;color:#fff}
.container{max-width:1800px;margin:0 auto;padding:24px}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;flex-wrap:wrap;gap:15px}
.header-left{display:flex;flex-direction:column;gap:6px}
.header-actions{display:flex;gap:12px;align-items:center}
h1{font-size:2.2rem;color:#facc15}
.tagline{font-size:.85rem;color:#94a3b8;font-style:italic}
.live-badge{display:inline-flex;align-items:center;gap:5px;color:#94a3b8;padding:3px 10px;border:1px solid #94a3b8;border-radius:20px;font-size:11px;font-weight:500;width:fit-content}
.live-dot{width:6px;height:6px;border-radius:50%;background:#94a3b8;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
#last-updated{font-size:11px;color:#94a3b8;opacity:.8}
.back-btn,.export-btn{background:#facc15;color:#000;padding:12px 18px;border-radius:12px;font-weight:700;text-decoration:none;border:none;cursor:pointer;font-size:.95rem}
.export-btn{background:#22c55e;color:white}
.dashboard-grid{display:grid;grid-template-columns:repeat(7,minmax(180px,1fr));gap:18px;margin-bottom:28px;overflow-x:auto}
.card{background:linear-gradient(145deg,#111827,#1e293b);padding:20px;border-radius:20px;border:1px solid rgba(255,255,255,.08);box-shadow:0 10px 30px rgba(0,0,0,.35);min-width:180px}
.card h3{font-size:.95rem;color:#cbd5e1;margin-bottom:10px}.card p{font-size:1.7rem;font-weight:800}
.profit{color:#22c55e}.loss{color:#ef4444}

/* ── Analytics Section ── */
.section-title{font-size:1.1rem;font-weight:700;color:#facc15;margin:8px 0 14px}
.chart-row{display:grid;gap:18px;margin-bottom:24px}
.chart-row.cols-1{grid-template-columns:1fr}
.chart-row.cols-2{grid-template-columns:1.4fr 1fr}
.chart-card{background:linear-gradient(145deg,#111827,#1e293b);border-radius:20px;border:1px solid rgba(255,255,255,.08);box-shadow:0 10px 30px rgba(0,0,0,.35);padding:20px}
.chart-card h4{font-size:.9rem;color:#cbd5e1;margin-bottom:14px;font-weight:600}
.canvas-wrap{position:relative;width:100%;height:280px}

/* ── Calendar Heatmap ── */
.calendar-row{display:flex;gap:16px;overflow-x:auto;padding-bottom:10px}
.month-card{background:linear-gradient(145deg,#111827,#1e293b);border-radius:16px;border:1px solid rgba(255,255,255,.08);padding:14px;min-width:240px;flex-shrink:0}
.month-title{font-size:.85rem;font-weight:700;color:#facc15;margin-bottom:10px;text-align:center}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-dow{font-size:.6rem;color:#64748b;text-align:center;padding-bottom:2px}
.cal-day{aspect-ratio:1;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.6rem;color:#fff;background:#1e293b40}
.cal-day.empty{background:transparent}
.cal-day .d{font-weight:700;font-size:.68rem;line-height:1.1}
.cal-day .p{font-size:.52rem;opacity:.9;line-height:1.1}

/* ── Filter Bar ── */
.filter-bar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:18px;background:#111827;border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:14px 18px}
.filter-bar label{font-size:.7rem;color:#94a3b8;text-transform:uppercase;letter-spacing:.4px;display:block;margin-bottom:4px}
.filter-field{display:flex;flex-direction:column}
.filter-bar select,.filter-bar input[type=date]{padding:9px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.1);background:#1e293b;color:#fff;font-size:.85rem;min-width:140px}
.search-box{padding:12px 16px;border-radius:12px;border:none;background:#1e293b;color:white;min-width:220px}
.btn-clear{padding:9px 16px;border-radius:10px;border:1px solid rgba(255,255,255,.15);background:transparent;color:#cbd5e1;font-size:.8rem;cursor:pointer;align-self:flex-end}
.btn-clear:hover{background:#1e293b}
.result-count{margin-left:auto;font-size:.8rem;color:#94a3b8;align-self:center}

/* ── Table ── */
.table-container{overflow-x:auto;background:#111827;border-radius:20px;border:1px solid rgba(255,255,255,.08)}
table{width:max-content;min-width:100%;border-collapse:collapse}
th{background:#facc15;color:#000;padding:14px 10px;font-size:.82rem;position:sticky;top:0;white-space:nowrap;cursor:pointer;user-select:none}
th .arrow{font-size:.7rem;opacity:.6;margin-left:3px}
td{padding:12px 10px;border-bottom:1px solid #1f2937;text-align:center;font-size:.85rem;white-space:nowrap}
td.note-cell{white-space:normal;text-align:left;min-width:200px;max-width:280px;font-size:.78rem;color:#cbd5e1;line-height:1.4}
tbody tr{cursor:pointer}
tr:hover{background:#172033}
.win-row{background:rgba(34,197,94,.06);border-left:3px solid #22c55e}
.loss-row{background:rgba(239,68,68,.05);border-left:3px solid #ef4444}
.badge{padding:6px 10px;border-radius:999px;font-size:.8rem;font-weight:700;display:inline-block}
.badge-win{background:rgba(34,197,94,.15);color:#22c55e}.badge-loss{background:rgba(239,68,68,.15);color:#ef4444}

/* ── Mobile card table ── */
.mobile-cards{display:none}
@media(max-width:768px){
.container{padding:16px}
h1{font-size:1.7rem}
.card p{font-size:1.4rem}
.dashboard-grid{grid-template-columns:repeat(7,180px)}
.chart-row.cols-2{grid-template-columns:1fr}
.table-container{display:none}
.mobile-cards{display:block}
.trade-card{background:linear-gradient(145deg,#111827,#1e293b);border-radius:14px;border:1px solid rgba(255,255,255,.08);padding:14px;margin-bottom:12px;cursor:pointer}
.trade-card.win{border-left:3px solid #22c55e}
.trade-card.loss{border-left:3px solid #ef4444}
.trade-card-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.trade-card-top strong{font-size:1rem}
.trade-card-meta{font-size:.75rem;color:#94a3b8;margin-bottom:6px}
.trade-card-pnl{font-size:1.1rem;font-weight:800}
}

/* ── Trade Detail Modal ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:1000;padding:20px}
.modal-overlay.open{display:flex}
.modal-box{background:#111827;border:1px solid rgba(255,255,255,.1);border-radius:18px;max-width:520px;width:100%;max-height:85vh;overflow-y:auto;padding:24px;position:relative;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.modal-close{position:absolute;top:16px;right:18px;background:none;border:none;color:#94a3b8;font-size:1.4rem;cursor:pointer;line-height:1}
.modal-close:hover{color:#fff}
.modal-box h3{color:#facc15;font-size:1.15rem;margin-bottom:2px}
.modal-sub{color:#94a3b8;font-size:.8rem;margin-bottom:14px}
.modal-row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #1f2937;font-size:.85rem;gap:12px}
.modal-row span:first-child{color:#94a3b8;white-space:nowrap}
.modal-row span:last-child{text-align:right;font-weight:600}
.modal-note{margin-top:14px}
.modal-note-label{font-size:.75rem;color:#facc15;font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px}
.modal-note p{font-size:.85rem;color:#cbd5e1;line-height:1.5;margin-bottom:14px;white-space:pre-wrap}
</style>
</head>
<body>
<div class="container">
<div class="header">
<div class="header-left">
<h1>📈 Trade Journal 2026</h1>
<p class="tagline">Every trade. Every lesson. Tracked.</p>
<span class="live-badge"><span class="live-dot"></span>Live from Google Sheets</span>
<span id="last-updated">Loading…</span>
</div>
<div class="header-actions">
<button class="export-btn" onclick="exportTableToCSV()">⬇ Export XLS</button>
<a href="index.html" class="back-btn">← Back to Home</a>
</div>
</div>
<div class="dashboard-grid">
<div class="card"><h3>Total Trades</h3><p id="totalTrades">0</p></div>
<div class="card"><h3>Gross P&L</h3><p id="totalPnL">0</p></div>
<div class="card"><h3>Charges</h3><p id="chargesValue" class="loss">0</p></div>
<div class="card"><h3>Net P&L</h3><p id="netPnLValue" class="profit">0</p></div>
<div class="card"><h3>Winning Trades</h3><p id="totalWins" class="profit">0</p></div>
<div class="card"><h3>Losing Trades</h3><p id="totalLosses" class="loss">0</p></div>
<div class="card"><h3>Win Rate</h3><p id="winRate">0%</p></div>
</div>

<div class="chart-row cols-1">
<div class="chart-card">
<h4>Performance by Strategy</h4>
<div class="canvas-wrap"><canvas id="setupChart"></canvas></div>
</div>
</div>

<div class="section-title">Daily P&L Calendar</div>
<div class="filter-bar">
<div class="filter-field"><label>Year</label><select id="calYearFilter"><option value="all">All Years</option></select></div>
<div class="filter-field"><label>Strategy</label><select id="calStrategyFilter"><option value="all">All Strategies</option></select></div>
<div class="filter-field"><label>Result</label><select id="calResultFilter"><option value="all">All</option><option value="win">Wins</option><option value="loss">Losses</option></select></div>
<button class="btn-clear" onclick="clearCalendarFilters()">✕ Clear</button>
</div>
<div class="calendar-row" id="calendarRow"></div>

<div class="section-title">Trade Log</div>
<div class="filter-bar">
<div class="filter-field"><label>Search</label><input type="text" id="searchInput" class="search-box" placeholder="Symbol / Strategy..."></div>
<div class="filter-field"><label>Strategy</label><select id="strategyFilter"><option value="all">All Strategies</option></select></div>
<div class="filter-field"><label>Result</label><select id="resultFilter"><option value="all">All</option><option value="win">Wins</option><option value="loss">Losses</option></select></div>
<div class="filter-field"><label>From</label><input type="date" id="dateFrom"></div>
<div class="filter-field"><label>To</label><input type="date" id="dateTo"></div>
<button class="btn-clear" onclick="clearFilters()">✕ Clear</button>
<span class="result-count" id="resultCount"></span>
</div>

<div class="table-container">
<table id="journalTable">
<thead id="tableHead"></thead>
<tbody id="tradeTable"></tbody>
</table>
</div>
<div class="mobile-cards" id="mobileCards"></div>
</div>

<div class="modal-overlay" id="tradeModal">
<div class="modal-box">
<button class="modal-close" onclick="closeTradeModal()">&times;</button>
<div id="modalContent"></div>
</div>
</div>

<script>
function inr(v){
const n=parseFloat((v||0).toString().replace(/,/g,''))||0;
return (n<0?'-':'')+'₹'+Math.round(Math.abs(n)).toLocaleString('en-IN');
}
function parseDDMMYYYY(s){
const m=(s||'').toString().trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
if(!m) return null;
return new Date(+m[3], +m[2]-1, +m[1]);
}
const MONTH_NAMES=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DOW=['S','M','T','W','T','F','S'];

const COLUMNS=[
{key:'no',label:'No'},
{key:'date',label:'Sale Date'},
{key:'symbol',label:'Symbol',bold:true},
{key:'direction',label:'Direction'},
{key:'strategy',label:'Strategy'},
{key:'qty',label:'Qty'},
{key:'sl',label:'Stop Loss'},
{key:'target',label:'Target'},
{key:'buy',label:'Buy Price'},
{key:'sale',label:'Sale Price'},
{key:'entryTime',label:'Entry Time'},
{key:'exitTime',label:'Exit Time'},
{key:'result',label:'Win/Loss',badge:true},
{key:'pnl',label:'Gross P&L',isNum:true,money:true},
{key:'ws',label:'WS'},
{key:'source',label:'Stock Selection'},
{key:'rr',label:'RR'},
{key:'rules',label:'Rules Followed'},
{key:'entryLogic',label:'Entry Logic',note:true},
{key:'emotion',label:'Emotion during entry',note:true},
{key:'mistakes',label:'Mistakes & Improvements',note:true}
];

let tradesArr=[];
let sortState={key:null,dir:1};

const sheetURL='https://docs.google.com/spreadsheets/d/e/2PACX-1vRbSrzX6IexJncqPlRZcpI4FxuSgliicUnB5_-zz3SLRGcquh_xZYpmXammjO4VTkp72s8PY8Eu1yaZ/pub?gid=1077617715&single=true&output=csv';
Papa.parse(sheetURL,{download:true,complete:function(results){
const rows=results.data;
const headerRowIndex=rows.findIndex(r=>(r[0]||'').toString().trim()==='No');
const totalsRowIndex=rows.findIndex(r=>(r[1]||'').toString().trim().toLowerCase()==='total');
const dataRows=rows.slice(headerRowIndex+1).filter(row=>row.some(cell=>cell.trim()!=='')).reverse();
let totalWins=0,totalLosses=0,totalPnL=0;
const chargesCell=totalsRowIndex>-1?(rows[totalsRowIndex][7]||'0'):'0';
const netPnLCell=totalsRowIndex>-1?(rows[totalsRowIndex][8]||'0'):'0';

tradesArr=dataRows.map(row=>{
const pnlValue=parseFloat((row[13]||'0').toString().replace(/,/g,''))||0;
const result=(row[12]||'').toString().trim();
if(result.toLowerCase().includes('win')) totalWins++;
if(result.toLowerCase().includes('loss')) totalLosses++;
totalPnL+=pnlValue;
return {
  no:row[0], date:row[1], symbol:row[2], direction:row[3], strategy:(row[4]||'').trim(),
  qty:row[5], sl:row[6], target:row[7], buy:row[8], sale:row[9],
  entryTime:row[10], exitTime:row[11], result, pnl:pnlValue,
  ws:row[14], source:row[15], rr:row[16], rules:row[17],
  entryLogic:row[18], emotion:row[19], mistakes:row[20]
};
});

document.getElementById('totalTrades').innerText=tradesArr.length;
document.getElementById('totalPnL').innerText=inr(totalPnL);
document.getElementById('chargesValue').innerText=inr(chargesCell);
document.getElementById('netPnLValue').innerText=inr(netPnLCell);
document.getElementById('totalWins').innerText=totalWins;
document.getElementById('totalLosses').innerText=totalLosses;
document.getElementById('winRate').innerText=((totalWins/tradesArr.length)*100 || 0).toFixed(1)+'%';

buildSetupChart(tradesArr);
populateStrategyFilter(tradesArr);
populateCalendarFilter(tradesArr);
buildHeader();
renderFiltered();

['searchInput','strategyFilter','resultFilter','dateFrom','dateTo'].forEach(id=>{
document.getElementById(id).addEventListener(id==='searchInput'?'keyup':'change',renderFiltered);
});
['calYearFilter','calStrategyFilter','calResultFilter'].forEach(id=>{
document.getElementById(id).addEventListener('change',renderCalendar);
});
renderCalendar();

const now=new Date();
document.getElementById('last-updated').textContent='Updated: '+
now.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})+' '+
now.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});
},error:function(){
document.getElementById('last-updated').textContent='Error loading data';
}});

function populateStrategyFilter(trades){
const set=[...new Set(trades.map(t=>t.strategy).filter(Boolean))].sort();
const sel=document.getElementById('strategyFilter');
set.forEach(s=>{ const o=document.createElement('option'); o.value=s; o.textContent=s; sel.appendChild(o); });
}

function populateCalendarFilter(trades){
const strategies=[...new Set(trades.map(t=>t.strategy).filter(Boolean))].sort();
const stratSel=document.getElementById('calStrategyFilter');
strategies.forEach(s=>{ const o=document.createElement('option'); o.value=s; o.textContent=s; stratSel.appendChild(o); });

const years=[...new Set(trades.map(t=>{ const d=parseDDMMYYYY(t.date); return d?d.getFullYear():null; }).filter(Boolean))].sort();
const yearSel=document.getElementById('calYearFilter');
years.forEach(y=>{ const o=document.createElement('option'); o.value=y; o.textContent=y; yearSel.appendChild(o); });
}

function clearCalendarFilters(){
document.getElementById('calYearFilter').value='all';
document.getElementById('calStrategyFilter').value='all';
document.getElementById('calResultFilter').value='all';
renderCalendar();
}

function renderCalendar(){
const year=document.getElementById('calYearFilter').value;
const strategy=document.getElementById('calStrategyFilter').value;
const result=document.getElementById('calResultFilter').value;
const list=tradesArr.filter(t=>{
if(strategy!=='all' && t.strategy!==strategy) return false;
if(result!=='all'){
const r=(t.result||'').toLowerCase();
if(result==='win' && !r.includes('win')) return false;
if(result==='loss' && !r.includes('loss')) return false;
}
if(year!=='all'){
const d=parseDDMMYYYY(t.date);
if(!d || String(d.getFullYear())!==year) return false;
}
return true;
});
buildCalendar(list);
}

function buildHeader(){
let html='<tr>';
COLUMNS.forEach(c=>{
const arrow=sortState.key===c.key?(sortState.dir===1?'▲':'▼'):'';
html+=`<th onclick="sortBy('${c.key}')">${c.label}<span class="arrow">${arrow}</span></th>`;
});
html+='</tr>';
document.getElementById('tableHead').innerHTML=html;
}

function sortBy(key){
if(sortState.key===key){ sortState.dir*=-1; } else { sortState.key=key; sortState.dir=1; }
buildHeader();
renderFiltered();
}

function getFilteredTrades(){
const search=document.getElementById('searchInput').value.toLowerCase();
const strategy=document.getElementById('strategyFilter').value;
const result=document.getElementById('resultFilter').value;
const from=document.getElementById('dateFrom').value ? new Date(document.getElementById('dateFrom').value) : null;
const to=document.getElementById('dateTo').value ? new Date(document.getElementById('dateTo').value) : null;

let list=tradesArr.filter(t=>{
const text=(t.symbol+' '+t.strategy+' '+t.direction).toLowerCase();
if(search && !text.includes(search)) return false;
if(strategy!=='all' && t.strategy!==strategy) return false;
if(result!=='all'){
const r=(t.result||'').toLowerCase();
if(result==='win' && !r.includes('win')) return false;
if(result==='loss' && !r.includes('loss')) return false;
}
if(from||to){
const d=parseDDMMYYYY(t.date);
if(!d) return false;
if(from && d<from) return false;
if(to && d>to) return false;
}
return true;
});

if(sortState.key){
const k=sortState.key;
list=[...list].sort((a,b)=>{
let av=a[k], bv=b[k];
if(k==='date'){ av=parseDDMMYYYY(a.date)||0; bv=parseDDMMYYYY(b.date)||0; }
else if(k==='pnl'||k==='no'){ av=parseFloat(av)||0; bv=parseFloat(bv)||0; }
else { av=(av||'').toString().toLowerCase(); bv=(bv||'').toString().toLowerCase(); }
return av<bv?-sortState.dir:av>bv?sortState.dir:0;
});
}
return list;
}

function clearFilters(){
document.getElementById('searchInput').value='';
document.getElementById('strategyFilter').value='all';
document.getElementById('resultFilter').value='all';
document.getElementById('dateFrom').value='';
document.getElementById('dateTo').value='';
renderFiltered();
}

function renderFiltered(){
const list=getFilteredTrades();
document.getElementById('resultCount').textContent=list.length+' of '+tradesArr.length+' trades';
renderTableRows(list);
renderMobileCards(list);
}

function renderTableRows(list){
let html='';
list.forEach(t=>{
const idx=tradesArr.indexOf(t);
const isWin=(t.result||'').toLowerCase().includes('win');
const isLoss=(t.result||'').toLowerCase().includes('loss');
const rowClass=isWin?'win-row':isLoss?'loss-row':'';
html+=`<tr class="${rowClass}" onclick="showTradeModal(${idx})">`;
COLUMNS.forEach(c=>{
let val=t[c.key];
let cls='';
if(c.badge){ val=isWin?'<span class="badge badge-win">WIN</span>':isLoss?'<span class="badge badge-loss">LOSS</span>':(val||'-'); }
else if(c.money){ cls=t.pnl>0?'profit':t.pnl<0?'loss':''; val=inr(t.pnl); }
else if(c.bold){ val=`<strong>${val||'-'}</strong>`; }
else { val=val===undefined||val===''?'-':val; }
html+=`<td class="${c.note?'note-cell':''} ${cls}">${val}</td>`;
});
html+='</tr>';
});
document.getElementById('tradeTable').innerHTML=html;
}

function renderMobileCards(list){
let html='';
list.forEach(t=>{
const idx=tradesArr.indexOf(t);
const isWin=(t.result||'').toLowerCase().includes('win');
html+=`<div class="trade-card ${isWin?'win':'loss'}" onclick="showTradeModal(${idx})">
<div class="trade-card-top"><strong>${t.symbol}</strong><span class="trade-card-pnl ${t.pnl>=0?'profit':'loss'}">${inr(t.pnl)}</span></div>
<div class="trade-card-meta">${t.date} · ${t.direction} · ${t.strategy}</div>
<span class="badge ${isWin?'badge-win':'badge-loss'}">${isWin?'WIN':'LOSS'}</span>
</div>`;
});
document.getElementById('mobileCards').innerHTML=html;
}

function buildSetupChart(trades){
const map={};
trades.forEach(t=>{
const key=(t.strategy||'Other').trim();
if(!map[key]) map[key]={profit:0,loss:0};
if(t.pnl>=0) map[key].profit+=t.pnl; else map[key].loss+=t.pnl;
});
const labels=Object.keys(map);
new Chart(document.getElementById('setupChart').getContext('2d'),{
type:'bar',
data:{ labels, datasets:[
  {label:'Profit', data:labels.map(k=>Math.round(map[k].profit)), backgroundColor:'#22c55e', borderRadius:4},
  {label:'Loss',   data:labels.map(k=>Math.round(map[k].loss)),   backgroundColor:'#ef4444', borderRadius:4}
]},
options:{
  responsive:true, maintainAspectRatio:false,
  plugins:{ legend:{labels:{color:'#cbd5e1'}}, tooltip:{callbacks:{label:c=>c.dataset.label+': '+inr(c.parsed.y)}} },
  scales:{
    x:{ ticks:{color:'#64748b'}, grid:{display:false} },
    y:{ ticks:{color:'#64748b', callback:v=>inr(v)}, grid:{color:'#1f2937'} }
  }
}
});
}

function buildCalendar(trades){
const dayMap={};
trades.forEach(t=>{
const d=parseDDMMYYYY(t.date);
if(!d) return;
const key=d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate();
if(!dayMap[key]) dayMap[key]=0;
dayMap[key]+=t.pnl;
});
const monthMap={};
trades.forEach(t=>{
const d=parseDDMMYYYY(t.date);
if(!d) return;
const mKey=d.getFullYear()+'-'+d.getMonth();
if(!monthMap[mKey]) monthMap[mKey]={year:d.getFullYear(),month:d.getMonth()};
});
const months=Object.values(monthMap).sort((a,b)=>(a.year-b.year)||(a.month-b.month));
const maxAbs=Math.max(1,...Object.values(dayMap).map(v=>Math.abs(v)));
let html='';
months.forEach(({year,month})=>{
const firstDow=new Date(year,month,1).getDay();
const daysInMonth=new Date(year,month+1,0).getDate();
html+=`<div class="month-card"><div class="month-title">${MONTH_NAMES[month]} ${year}</div><div class="cal-grid">`;
DOW.forEach(d=>html+=`<div class="cal-dow">${d}</div>`);
for(let i=0;i<firstDow;i++) html+='<div class="cal-day empty"></div>';
for(let day=1;day<=daysInMonth;day++){
const key=year+'-'+month+'-'+day;
const pnl=dayMap[key];
let bg='#1e293b40', textP='';
if(pnl!==undefined){
const intensity=Math.min(1,Math.abs(pnl)/maxAbs);
if(pnl>=0) bg=`rgba(34,197,94,${0.25+intensity*0.55})`;
else bg=`rgba(239,68,68,${0.25+intensity*0.55})`;
textP=`<div class="p">${pnl>=0?'+':''}${Math.round(pnl)}</div>`;
}
html+=`<div class="cal-day" style="background:${bg}" title="${MONTH_NAMES[month]} ${day}, ${year}${pnl!==undefined?': '+inr(pnl):''}"><div class="d">${day}</div>${textP}</div>`;
}
html+='</div></div>';
});
document.getElementById('calendarRow').innerHTML=html || '<p style="color:#94a3b8;font-size:.85rem">No dated trades to display.</p>';
}

function showTradeModal(idx){
const t=tradesArr[idx];
if(!t) return;
const isWin=(t.result||'').toLowerCase().includes('win');
document.getElementById('modalContent').innerHTML=`
<h3>${t.symbol} <span class="badge ${isWin?'badge-win':'badge-loss'}">${isWin?'WIN':'LOSS'}</span></h3>
<div class="modal-sub">${t.date} · ${t.direction} · ${t.strategy}</div>
<div class="modal-row"><span>P&L</span><span class="${t.pnl>=0?'profit':'loss'}">${inr(t.pnl)}</span></div>
<div class="modal-row"><span>Qty</span><span>${t.qty||'-'}</span></div>
<div class="modal-row"><span>Buy / Sale Price</span><span>${t.buy||'-'} / ${t.sale||'-'}</span></div>
<div class="modal-row"><span>Stop Loss / Target</span><span>${t.sl||'-'} / ${t.target||'-'}</span></div>
<div class="modal-row"><span>Entry / Exit Time</span><span>${t.entryTime||'-'} / ${t.exitTime||'-'}</span></div>
<div class="modal-row"><span>RR</span><span>${t.rr||'-'}</span></div>
<div class="modal-row"><span>Rules Followed</span><span>${t.rules||'-'}</span></div>
<div class="modal-row"><span>Source</span><span>${t.source||'-'}</span></div>
<div class="modal-note">
<div class="modal-note-label">Entry Logic</div><p>${t.entryLogic||'—'}</p>
<div class="modal-note-label">Emotion During Entry</div><p>${t.emotion||'—'}</p>
<div class="modal-note-label">Mistakes & Improvements</div><p>${t.mistakes||'—'}</p>
</div>`;
document.getElementById('tradeModal').classList.add('open');
}
function closeTradeModal(){ document.getElementById('tradeModal').classList.remove('open'); }
document.getElementById('tradeModal').addEventListener('click',e=>{ if(e.target.id==='tradeModal') closeTradeModal(); });

function exportTableToCSV(){
let csv=[];
const rows=document.querySelectorAll('#journalTable tr');
rows.forEach(row=>{
const cols=row.querySelectorAll('td, th');
const rowData=[];
cols.forEach(col=>rowData.push(col.innerText));
csv.push(rowData.join(','));
});
const csvFile=new Blob([csv.join('\n')],{type:'text/csv'});
const downloadLink=document.createElement('a');
downloadLink.download='Trading_Journal.xls';
downloadLink.href=window.URL.createObjectURL(csvFile);
downloadLink.style.display='none';
document.body.appendChild(downloadLink);
downloadLink.click();
}
</script>
