<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Trading Journal Dashboard</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family:Arial, sans-serif;
      background:#0f172a;
      color:white;
      padding:25px;
    }

    h1{
      text-align:center;
      margin-bottom:30px;
      color:#facc15;
      font-size:36px;
    }

    .summary{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
      gap:20px;
      margin-bottom:30px;
    }

    .card{
      background:#111827;
      padding:20px;
      border-radius:14px;
      border:1px solid #374151;
      text-align:center;
    }

    .card h2{
      color:#facc15;
      margin-bottom:10px;
      font-size:18px;
    }

    .card p{
      font-size:28px;
      font-weight:bold;
    }

    .table-container{
      overflow-x:auto;
      border-radius:14px;
    }

    table{
      width:100%;
      border-collapse:collapse;
      background:#111827;
      border-radius:14px;
      overflow:hidden;
    }

    th{
      background:#facc15;
      color:black;
      padding:14px;
      font-size:14px;
      position:sticky;
      top:0;
    }

    td{
      padding:12px;
      border-bottom:1px solid #374151;
      text-align:center;
      font-size:14px;
    }

    tr:hover{
      background:#1f2937;
    }

    .profit{
      color:#22c55e;
      font-weight:bold;
    }

    .loss{
      color:#ef4444;
      font-weight:bold;
    }

  </style>
</head>

<body>

<h1>Trading Journal Dashboard</h1>

<div class="summary">

  <div class="card">
    <h2>Total Trades</h2>
    <p id="totalTrades">0</p>
  </div>

  <div class="card">
    <h2>Total P&L</h2>
    <p id="totalPnL">0</p>
  </div>

</div>

<div class="table-container">
  <table id="tradeTable"></table>
</div>

<script>

const sheetURL =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vRbSrzX6IexJncqPlRZcpI4FxuSgliicUnB5_-zz3SLRGcquh_xZYpmXammjO4VTkp72s8PY8Eu1yaZ/pub?gid=1077617715&single=true&output=csv";

fetch(sheetURL)
.then(response => response.text())
.then(csv => {

    const rows = csv
      .split("\n")
      .map(row => row.split(","));

    // HEADER ROW = Row 7
    const headers = rows[6];

    // DATA ROWS = Row 8 onwards
    const dataRows = rows.slice(7).filter(row => row.join("").trim() !== "");

    let tableHTML = "";

    // Create Header
    tableHTML += "<tr>";

    headers.forEach(header => {
      tableHTML += `<th>${header}</th>`;
    });

    tableHTML += "</tr>";

    let totalTrades = 0;
    let totalPnL = 0;

    // Create Data Rows
    dataRows.forEach(row => {

      tableHTML += "<tr>";

      row.forEach(cell => {

        let className = "";

        const cleanCell = cell.replace(/"/g,'').trim();

        // Profit/Loss Coloring
        if(!isNaN(cleanCell) && cleanCell !== ""){

          const num = Number(cleanCell);

          if(num > 0){
            className = "profit";
          }

          if(num < 0){
            className = "loss";
          }

        }

        tableHTML += `<td class="${className}">${cleanCell}</td>`;

      });

      tableHTML += "</tr>";

      totalTrades++;

      // Auto detect P&L values
      row.forEach(cell => {

        const value = Number(cell);

        if(!isNaN(value)){
          totalPnL += value;
        }

      });

    });

    document.getElementById("tradeTable").innerHTML = tableHTML;

    document.getElementById("totalTrades").innerText = totalTrades;

    document.getElementById("totalPnL").innerText =
      totalPnL.toFixed(2);

});

</script>

</body>
</html>
