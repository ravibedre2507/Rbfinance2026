<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trading Journal Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:#050816;color:#fff;padding:24px}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;flex-wrap:wrap;gap:15px}
.header-actions{display:flex;gap:12px;align-items:center}
h1{font-size:2.2rem;color:#facc15}
.back-btn,.export-btn{background:#facc15;color:#000;padding:12px 18px;border-radius:12px;font-weight:700;text-decoration:none;border:none;cursor:pointer;font-size:.95rem}
.export-btn{background:#22c55e;color:white}
.dashboard-grid{display:grid;grid-template-columns:repeat(7,minmax(180px,1fr));gap:18px;margin-bottom:28px;overflow-x:auto}
.card{background:linear-gradient(145deg,#111827,#1e293b);padding:20px;border-radius:20px;border:1px solid rgba(255,255,255,.08);box-shadow:0 10px 30px rgba(0,0,0,.35);min-width:180px}
.card h3{font-size:.95rem;color:#cbd5e1;margin-bottom:10px}.card p{font-size:1.7rem;font-weight:800}
.profit{color:#22c55e}.loss{color:#ef4444}
.controls{display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap;margin-bottom:18px}
.search-box,.filter-box{padding:12px 16px;border-radius:12px;border:none;background:#1e293b;color:white;min-width:220px}
.table-container{overflow-x:auto;background:#111827;border-radius:20px;border:1px solid rgba(255,255,255,.08)}
table{width:100%;border-collapse:collapse}
th{background:#facc15;color:#000;padding:14px;font-size:.9rem;position:sticky;top:0}
td{padding:12px;border-bottom:1px solid #1f2937;text-align:center;font-size:.9rem}
tr:hover{background:#172033}.win-row{background:rgba(34,197,94,.06)}.loss-row{background:rgba(239,68,68,.05)}
.badge{padding:6px 10px;border-radius:999px;font-size:.8rem;font-weight:700}
.badge-win{background:rgba(34,197,94,.15);color:#22c55e}.badge-loss{background:rgba(239,68,68,.15);color:#ef4444}
@media(max-width:768px){body{padding:16px}h1{font-size:1.7rem}.card p{font-size:1.4rem}.dashboard-grid{grid-template-columns:repeat(7,180px)}}
</style>
</head>
<body>
<div class="header">
<h1>📈 Trading Journal Dashboard</h1>
<div class="header-actions">
<input type="text" id="searchInput" class="search-box" placeholder="Search Stock / Setup...">
<button class="export-btn" onclick="exportTableToCSV()">⬇ Export XLS</button>
<a href="index.html" class="back-btn">← Back to Home</a>
</div>
</div>
<div class="dashboard-grid">
<div class="card"><h3>Total Trades</h3><p id="totalTrades">0</p></div>
<div class="card"><h3>Gross P&L</h3><p id="totalPnL">0</p></div>
<div class="card"><h3>Charges</h3><p id="chargesValue" class="loss">0</p></div>
<div class="card"><h3>Net P&L</h3><p id="netPnLValue" class="profit">0</p></div>
<div class="card"><h3>Winning Trades</h3><p id="totalWins" class="profit">0</p></div>
<div class="card"><h3>Losing Trades</h3><p id="totalLosses" class="loss">0</p></div>
<div class="card"><h3>Win Rate</h3><p id="winRate">0%</p></div>
</div>
<div class="controls">
</select>
</div>
<div class="table-container">
<table id="journalTable">
<thead id="tableHead"></thead>
<tbody id="tradeTable"></tbody>
</table>
</div>
<script>
const sheetURL='https://docs.google.com/spreadsheets/d/e/2PACX-1vRbSrzX6IexJncqPlRZcpI4FxuSgliicUnB5_-zz3SLRGcquh_xZYpmXammjO4VTkp72s8PY8Eu1yaZ/pub?gid=1077617715&single=true&output=csv';
Papa.parse(sheetURL,{download:true,complete:function(results){
const rows=results.data;
const headers=rows[6];
const dataRows=rows.slice(7).filter(row=>row.some(cell=>cell.trim()!=='')).reverse();
const resultColumnIndex=12;
const pnlColumnIndex=13;
let totalTrades=0,totalPnL=0,totalWins=0,totalLosses=0;
const chargesCell=(rows[4] && rows[4][7]) ? rows[4][7] : '0';
const netPnLCell=(rows[4] && rows[4][8]) ? rows[4][8] : '0';
let tableHead='<tr>';
headers.forEach(header=>{tableHead+=`<th>${header}</th>`});
tableHead+='</tr>';
document.getElementById('tableHead').innerHTML=tableHead;
let tableHTML='';
dataRows.forEach((row)=>{
const pnlCell=row[pnlColumnIndex]||'0';
const pnlValue=parseFloat(pnlCell.toString().replace(/,/g,''))||0;
const resultCell=(row[resultColumnIndex]||'').toString().toLowerCase().trim();
let rowClass='';
if(resultCell.includes('win')){totalWins++;rowClass='win-row'}
if(resultCell.includes('loss')){totalLosses++;rowClass='loss-row'}
totalTrades++;
totalPnL+=pnlValue;
tableHTML+=`<tr class="${rowClass}" data-result="${resultCell}">`;
row.forEach((cell,index)=>{
let className='';
let displayCell=cell;
if(index===resultColumnIndex){
if(resultCell.includes('win')){displayCell='WIN'}
if(resultCell.includes('loss')){displayCell='LOSS'}
}
if(index===pnlColumnIndex){
if(pnlValue>0){className='profit'}
if(pnlValue<0){className='loss'}
}
tableHTML+=`<td class="${className}">${displayCell}</td>`;
});
tableHTML+='</tr>';
});
document.getElementById('tradeTable').innerHTML=tableHTML;
document.getElementById('totalTrades').innerText=totalTrades;
document.getElementById('totalPnL').innerText=Math.round(totalPnL);
document.getElementById('chargesValue').innerText=chargesCell;
document.getElementById('netPnLValue').innerText=netPnLCell;
document.getElementById('totalWins').innerText=totalWins;
document.getElementById('totalLosses').innerText=totalLosses;
document.getElementById('winRate').innerText=((totalWins/totalTrades)*100 || 0).toFixed(1)+'%';

function applyFilters(){
const searchValue=document.getElementById('searchInput').value.toLowerCase();
const resultValue=document.getElementById('resultFilter').value;
const rows=document.querySelectorAll('#tradeTable tr');
rows.forEach(row=>{
const text=row.innerText.toLowerCase();
const result=row.getAttribute('data-result');
const searchMatch=text.includes(searchValue);
const resultMatch=resultValue==='all'||result.includes(resultValue);
row.style.display=(searchMatch && resultMatch)?'':'none';
});
}

document.getElementById('searchInput').addEventListener('keyup',applyFilters);
document.getElementById('resultFilter').addEventListener('change',applyFilters);
}});

function exportTableToCSV(){
let csv=[];
const rows=document.querySelectorAll('table tr');
rows.forEach(row=>{
const cols=row.querySelectorAll('td, th');
const rowData=[];
cols.forEach(col=>rowData.push(col.innerText));
csv.push(rowData.join(','));
});
const csvFile=new Blob([csv.join('\n')],{type:'text/csv'});
const downloadLink=document.createElement('a');
downloadLink.download='Trading_Journal.xls';
downloadLink.href=window.URL.createObjectURL(csvFile);
downloadLink.style.display='none';
document.body.appendChild(downloadLink);
downloadLink.click();
}
</script>
</body>
</html>
