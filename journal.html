<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Trading Journal Dashboard</title>

  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

  <style>

    body{
      margin:0;
      padding:20px;
      background:#0f172a;
      color:white;
      font-family:Arial,sans-serif;
    }

    h1{
      text-align:center;
      color:#facc15;
      margin-bottom:30px;
    }

    .summary{
      display:flex;
      gap:20px;
      margin-bottom:30px;
      flex-wrap:wrap;
    }

    .card{
      background:#111827;
      padding:20px;
      border-radius:12px;
      flex:1;
      min-width:220px;
      text-align:center;
      border:1px solid #374151;
    }

    .card h2{
      color:#facc15;
      margin-bottom:10px;
      font-size:20px;
    }

    .card p{
      font-size:28px;
      font-weight:bold;
    }

    .table-container{
      overflow-x:auto;
    }

    table{
      width:100%;
      border-collapse:collapse;
      background:#111827;
    }

    th{
      background:#facc15;
      color:black;
      padding:12px;
      font-size:14px;
      position:sticky;
      top:0;
    }

    td{
      padding:10px;
      border-bottom:1px solid #374151;
      text-align:center;
      font-size:14px;
    }

    tr:hover{
      background:#1f2937;
    }

    .profit{
      color:#22c55e;
      font-weight:bold;
    }

    .loss{
      color:#ef4444;
      font-weight:bold;
    }

  </style>
</head>

<body>

<h1>Trading Journal Dashboard</h1>

<div class="summary">

  <div class="card">
    <h2>Total Trades</h2>
    <p id="totalTrades">0</p>
  </div>

  <div class="card">
    <h2>Total Gross P&L</h2>
    <p id="totalPnL">0</p>
  </div>

  <div class="card">
    <h2>Total Wins</h2>
    <p id="totalWins" class="profit">0</p>
  </div>

  <div class="card">
    <h2>Total Losses</h2>
    <p id="totalLosses" class="loss">0</p>
  </div>

</div>

<div class="table-container">
  <table id="tradeTable"></table>
</div>

<script>

const sheetURL =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vRbSrzX6IexJncqPlRZcpI4FxuSgliicUnB5_-zz3SLRGcquh_xZYpmXammjO4VTkp72s8PY8Eu1yaZ/pub?gid=1077617715&single=true&output=csv";

Papa.parse(sheetURL, {

    download: true,

    complete: function(results) {

        const rows = results.data;

        // Header row = Row 7
        const headers = rows[6];

        // Trade rows start from Row 8
        const dataRows = rows.slice(7).filter(row =>
            row.some(cell => cell.trim() !== "")
        );

        let tableHTML = "";

        // Create Header
        tableHTML += "<tr>";

        headers.forEach(header => {
            tableHTML += `<th>${header}</th>`;
        });

        tableHTML += "</tr>";

        let totalTrades = 0;
        let totalPnL = 0;
        let totalWins = 0;
        let totalLosses = 0;

        // Column M = Win/Loss
        const resultColumnIndex = 12;

        // Column N = Gross P&L
        const pnlColumnIndex = 13;

        // Create Rows
        dataRows.forEach(row => {

            tableHTML += "<tr>";

            row.forEach((cell,index) => {

                let className = "";

                // Highlight Gross P&L Column
                if(index === pnlColumnIndex){

                    const pnlValue = parseFloat(cell.replace(/,/g,''));

                    if(!isNaN(pnlValue)){

                        if(pnlValue > 0){
                            className = "profit";
                        }

                        if(pnlValue < 0){
                            className = "loss";
                        }
                    }
                }

                tableHTML += `<td class="${className}">${cell}</td>`;

            });

            tableHTML += "</tr>";

            totalTrades++;

            // Calculate Total Gross P&L from Column N
            const pnlCell = row[pnlColumnIndex] || "0";
            const pnlValue = parseFloat(pnlCell.replace(/,/g,''));

            if(!isNaN(pnlValue)){
                totalPnL += pnlValue;
            }

            // Count Wins & Losses from Column M
            const resultCell = (row[resultColumnIndex] || "").toString().toLowerCase().trim();

            if(resultCell.includes('win')){
                totalWins++;
            }

            if(resultCell.includes('loss')){
                totalLosses++;
            }

        });

        document.getElementById("tradeTable").innerHTML = tableHTML;

        document.getElementById("totalTrades").innerText = totalTrades;

        document.getElementById("totalPnL").innerText =
            totalPnL.toFixed(2);

        document.getElementById("totalWins").innerText = totalWins;

        document.getElementById("totalLosses").innerText = totalLosses;

    }

});

</script>

</body>
</html>
