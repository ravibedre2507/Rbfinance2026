<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Masterclasses</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
body{
margin:0;
background:#050816;
color:white;
font-family:'Inter',sans-serif;
position:relative;
}

.container{
max-width:1400px;
margin:auto;
padding:40px 20px;
}

.page-title{
text-align:center;
margin-bottom:50px;
font-size:2.5rem;
}

.video-grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:30px;
}

.video-card{
background:#111827;
padding:20px;
border-radius:24px;
box-shadow:0 10px 30px rgba(0,0,0,0.4);
}

.video-card h2{
text-align:center;
margin-bottom:20px;
color:#f5a623;
}

.video-box{
border-radius:20px;
overflow:hidden;
}

.back-btn{
display:inline-block;
padding:12px 20px;
background:#f5a623;
color:#050816;
border-radius:12px;
font-weight:700;
text-decoration:none;
position:absolute;
top:40px;
right:40px;
}

@media(max-width:768px){
.video-grid{
grid-template-columns:1fr;
}

.back-btn{
top:20px;
right:20px;
padding:10px 16px;
font-size:.9rem;
}

iframe{
height:260px;
}
}
</style>
</head>

<body>

<div class="container">

<a href="index.html" class="back-btn">← Back to Home</a>

<h1 class="page-title">AI Masterclasses</h1>

<div class="video-grid">

<div class="video-card">
<h2>AI Masterclass - 1</h2>
<div class="video-box">
<iframe width="100%" height="350"
src="https://www.youtube.com/embed/fVXJ4gpy95Y"
title="AI Masterclass - 1"
frameborder="0"
allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
allowfullscreen>
</iframe>
</div>
</div>

<div class="video-card">
<h2>AI Masterclass - 2</h2>
<div class="video-box">
<iframe width="100%" height="350"
src="https://www.youtube.com/embed/keEi0LoZwL0"
title="AI Masterclass - 2"
frameborder="0"
allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
allowfullscreen>
</iframe>
</div>
</div>

</div>

</div>

</body>
</html>
